{% extends 'base.html' %}

{% block title %}Editar Fornecedor{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Editar Fornecedor</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nome da Empresa</label>
            <input type="text" class="form-control" name="nome_empresa" value="{{ fornecedor.nome_empresa }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">CNPJ</label>
            <input type="text" class="form-control" name="cnpj" value="{{ fornecedor.cnpj }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" value="{{ fornecedor.email }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" class="form-control" name="telefone" value="{{ fornecedor.telefone }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Endereço</label>
            <input type="text" class="form-control" name="endereco" value="{{ fornecedor.endereco }}">
        </div>
        <button type="submit" class="btn btn-success">Atualizar</button>
        <a href="{{ url_for('listar_fornecedores') }}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
{% endblock %}
