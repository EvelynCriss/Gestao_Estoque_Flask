<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Fornecedores</title>
</head>
<body>
    <h1>Lista de Fornecedores</h1>
    <a href="{{ url_for('fornecedores.add') }}">Adicionar Fornecedor</a>
    <table border="1" cellpadding="5" cellspacing="0">
        <tr>
            <th>Nome da Empresa</th>
            <th>CNPJ</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Endereço</th>
            <th>Ações</th>
        </tr>
        {% for fornecedor in fornecedores %}
        <tr>
            <td>{{ fornecedor.nome_empresa }}</td>
            <td>{{ fornecedor.cnpj }}</td>
            <td>{{ fornecedor.email }}</td>
            <td>{{ fornecedor.telefone }}</td>
            <td>{{ fornecedor.endereco }}</td>
            <td>
                <a href="{{ url_for('fornecedores.edit', id=fornecedor.id) }}">Editar</a> |
                <a href="{{ url_for('fornecedores.delete', id=fornecedor.id) }}" onclick="return confirm('Tem certeza que deseja deletar?')">Deletar</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
