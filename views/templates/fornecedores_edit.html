<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Editar Fornecedor</title>
</head>
<body>
    <h1>Editar fornecedor</h1>
    <form method="post" action="{{ url_for('edit', id=fornecedor.id) }}">
        <label>Nome da Empresa:<br>
            <input type="text" name="nome_empresa" value="{{ fornecedor.nome_empresa }}" required>
        </label><br><br>

        <label>CNPJ:<br>
            <input type="text" name="cnpj" value="{{ fornecedor.cnpj }}" required>
        </label><br><br>

        <label>Email:<br>
            <input type="email" name="email" value="{{ fornecedor.email }}">
        </label><br><br>

        <label>Telefone:<br>
            <input type="text" name="telefone" value="{{ fornecedor.telefone }}">
        </label><br><br>

        <label>Endereço:<br>
            <input type="text" name="endereco" value="{{ fornecedor.endereco }}">
        </label><br><br>

        <button type="submit">Atualizar</button>
        <a href="{{ url_for('home') }}">Cancelar</a>
    </form>
</body>
</html>
