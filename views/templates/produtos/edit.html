{% extends 'base_admin.html' %}

{% block title %}Editar Produto{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Editar Produto</h1>
    <a href="{{ url_for('listar_produtos') }}" class="btn btn-secondary">Voltar</a>
</div>

<div class="content-section">
    <form method="POST" action="{{ url_for('edit_produto', id=produto.id) }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="nome">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" value="{{ produto.nome }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="preco">Preço</label>
                <input type="text" class="form-control" id="preco" name="preco" value="{{ produto.preco }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="estoque_minimo">Estoque Mínimo</label>
                <input type="number" class="form-control" id="estoque_minimo" name="estoque_minimo" min="0" value="{{ produto.estoque_minimo }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="categoria">Categoria</label>
                <input type="text" class="form-control" id="categoria" name="categoria" value="{{ produto.categoria or '' }}">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="unidade">Unidade</label>
            <input type="text" class="form-control" id="unidade" name="unidade" value="{{ produto.unidade or '' }}">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Atualizar Produto</button>
            <a href="{{ url_for('listar_produtos') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
