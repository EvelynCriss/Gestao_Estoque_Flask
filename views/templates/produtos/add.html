{% extends 'base_admin.html' %}

{% block title %}Adicionar Produto{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Novo Produto</h1>
    <a href="{{ url_for('listar_produtos') }}" class="btn btn-secondary">Voltar</a>
</div>

<div class="content-section">
    <form method="POST" action="{{ url_for('add_produto') }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="nome">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" required placeholder="Nome do produto">
            </div>

            <div class="form-group">
                <label class="form-label" for="preco">Preço</label>
                <input type="text" class="form-control" id="preco" name="preco" required placeholder="0.00">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="estoque_minimo">Estoque Mínimo</label>
                <input type="number" class="form-control" id="estoque_minimo" name="estoque_minimo" min="0" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="categoria">Categoria</label>
                <input type="text" class="form-control" id="categoria" name="categoria" placeholder="Categoria (opcional)">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="unidade">Unidade</label>
            <input type="text" class="form-control" id="unidade" name="unidade" placeholder="Ex: un, kg, litro (opcional)">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar Produto</button>
            <a href="{{ url_for('listar_produtos') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
