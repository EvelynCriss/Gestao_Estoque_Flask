{% extends 'base_admin.html' %}

{% block title %}Adicionar Pedido{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Adicionar Pedido</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Fornecedor <span class="text-danger">*</span></label>
            <select class="form-control" name="fornecedor_id" required>
                <option value="">Selecione um fornecedor</option>
                {% for f in fornecedores %}
                <option value="{{ f.id }}">{{ f.nome_empresa }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Data do Pedido</label>
            <input type="date" class="form-control" name="data_pedido" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-control" name="status">
                <option value="pendente" selected>Pendente</option>
                <option value="aprovado">Aprovado</option>
                <option value="rejeitado">Rejeitado</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Valor Total</label>
            <input type="number" step="0.01" class="form-control" name="valor_total">
        </div>
        <button type="submit" class="btn btn-success">Cadastrar</button>
        <a href="{{ url_for('listar_pedidos') }}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
{% endblock %}
