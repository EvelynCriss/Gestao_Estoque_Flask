{% extends 'base.html' %}

{% block title %}Editar Pedido{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Editar Pedido</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Fornecedor <span class="text-danger">*</span></label>
            <select class="form-control" name="fornecedor_id" required>
                <option value="">Selecione um fornecedor</option>
                {% for f in fornecedores %}
                <option value="{{ f.id }}" {% if pedido.fornecedor_id == f.id %}selected{% endif %}>{{ f.nome_empresa }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Data do Pedido</label>
            <input type="date" class="form-control" name="data_pedido" value="{{ pedido.data_pedido or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-control" name="status">
                <option value="pendente" {% if pedido.status == 'pendente' %}selected{% endif %}>Pendente</option>
                <option value="aprovado" {% if pedido.status == 'aprovado' %}selected{% endif %}>Aprovado</option>
                <option value="rejeitado" {% if pedido.status == 'rejeitado' %}selected{% endif %}>Rejeitado</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Valor Total</label>
            <input type="number" step="0.01" class="form-control" name="valor_total" value="{{ pedido.valor_total or '' }}">
        </div>
        <button type="submit" class="btn btn-success">Atualizar</button>
        <a href="{{ url_for('listar_pedidos') }}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
{% endblock %}
