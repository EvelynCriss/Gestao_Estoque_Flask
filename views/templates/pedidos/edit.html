{% extends 'base_admin.html' %}

{% block title %}Editar Pedido{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Editar Pedido</h1>
    <a href="{{ url_for('listar_pedidos') }}" class="btn btn-secondary">Voltar</a>
</div>

<div class="content-section" id="pedido-items" data-produtos='{{ produtos | tojson | safe }}'>
    <form method="POST" action="{{ url_for('edit_pedido', id=pedido.id) }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="fornecedor_id">Fornecedor <span style="color: #c0392b">*</span></label>
                <select class="form-control" id="fornecedor_id" name="fornecedor_id" required>
                    <option value="">Selecione um fornecedor</option>
                    {% for f in fornecedores %}
                        <option value="{{ f.id }}" {% if pedido.fornecedor_id == f.id %}selected{% endif %}>{{ f.nome_empresa }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="data_pedido">Data do Pedido</label>
                <input type="date" class="form-control" id="data_pedido" name="data_pedido" value="{{ pedido.data_pedido or '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="status">Status</label>
                <select class="form-control" id="status" name="status">
                    <option value="pendente" {% if pedido.status == 'pendente' %}selected{% endif %}>Pendente</option>
                    <option value="aprovado" {% if pedido.status == 'aprovado' %}selected{% endif %}>Aprovado</option>
                    <option value="rejeitado" {% if pedido.status == 'rejeitado' %}selected{% endif %}>Rejeitado</option>
                </select>
            </div>
        </div>

        <hr>

        <div class="form-row">
            <div class="form-group" style="width:100%">
                <label class="form-label">Itens do Pedido</label>
                <table class="table" id="items-table">
                    <thead>
                        <tr>
                            <th style="width:50%">Produto</th>
                            <th style="width:15%">Quantidade</th>
                            <th style="width:20%">Preço Unitário</th>
                            <th style="width:15%">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="items-body">
                        {% if itens %}
                            {% for it in itens %}
                                <tr>
                                    <td>
                                        <select name="produto_id[]" class="form-control">
                                            <option value="">Selecione um produto</option>
                                            {% for prod in produtos %}
                                                <option value="{{ prod.id }}" {% if prod.id == it.produto_id %}selected{% endif %}>{{ prod.nome }}</option>
                                            {% endfor %}
                                        </select>
                                    </td>
                                    <td><input type="number" name="quantidade[]" class="form-control" min="1" value="{{ it.quantidade }}"></td>
                                    <td>
                                        <input type="hidden" name="preco_unitario[]" class="preco-hidden" value="{{ it.preco_unitario }}">
                                        <input type="text" class="form-control preco-display" value="{{ it.preco_unitario }}" readonly>
                                    </td>
                                    <td><button type="button" class="btn btn-danger btn-sm remove-item">Remover</button></td>
                                </tr>
                            {% endfor %}
                        {% else %}
                            <tr>
                                <td>
                                    <select name="produto_id[]" class="form-control">
                                        <option value="">Selecione um produto</option>
                                        {% for prod in produtos %}
                                            <option value="{{ prod.id }}">{{ prod.nome }}</option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td><input type="number" name="quantidade[]" class="form-control" min="1" value="1"></td>
                                <td>
                                    <input type="hidden" name="preco_unitario[]" class="preco-hidden" value="0.00">
                                    <input type="text" class="form-control preco-display" value="0.00" readonly>
                                </td>
                                <td><button type="button" class="btn btn-danger btn-sm remove-item">Remover</button></td>
                            </tr>
                        {% endif %}
                    </tbody>
                </table>
                <button type="button" class="btn btn-secondary_item" id="add-item">Adicionar Item</button>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Atualizar Pedido</button>
            <a href="{{ url_for('listar_pedidos') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
